version: 2

models:
  - name: stg_order_items
    description: "Lignes de commande nettoyées et typées. Grain : order_id + order_item_id."
    columns:
      - name: order_id
        description: "Identifiant de la commande"
        tests: [not_null]
      - name: order_item_id
        description: "Numéro de l'article dans la commande"
        tests: [not_null]
      - name: product_id
        description: "Produit vendu"
        tests: [not_null]
      - name: seller_id
        description: "Vendeur"
        tests: [not_null]
      - name: price
        description: "Prix de l'article (BRL)"
      - name: freight_value
        description: "Frais de port de l'article (BRL)"

  - name: stg_order_payments
    description: "Paiements par commande. Grain : order_id + payment_sequential."
    columns:
      - name: order_id
        description: "Identifiant de la commande"
        tests: [not_null]
      - name: payment_type
        description: "Mode de paiement (credit_card, boleto, voucher, debit_card, not_defined)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_installments
        description: "Nombre d'échéances"
      - name: payment_value
        description: "Montant du paiement (BRL)"

  - name: stg_order_reviews
    description: "Avis clients bruts typés. Plusieurs avis par commande possibles (dédupliqués plus loin)."
    columns:
      - name: review_id
        description: "Identifiant de l'avis (non unique dans la source)"
      - name: order_id
        description: "Commande évaluée"
        tests: [not_null]
      - name: review_score
        description: "Note de 1 à 5"
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

  - name: stg_product_category_translation
    description: "Traduction des catégories de produits du portugais vers l'anglais."
    columns:
      - name: product_category_name
        description: "Catégorie en portugais"
        tests: [unique, not_null]
      - name: product_category_name_english
        description: "Catégorie en anglais"
